[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "viaduct"
version = "0.1.0"
description = "Experimental KiCad MCP server next to Konnect: out-of-scope features and a testing ground for new AI tools, over KiCad's IPC API"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "kicad-python>=0.5.0",
    "shapely>=2.0",
    "numpy",
    "mcp>=1.2",
]

[project.scripts]
viaduct = "viaduct.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
