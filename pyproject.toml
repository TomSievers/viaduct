[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "viaduct"
version = "0.1.0"
description = "Experimental KiCad MCP server next to Konnect: out-of-scope features and a testing ground for new AI tools, over KiCad's IPC API"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
# Viaduct tracks the newest releases: each floor is the newest version that both PyPI and
# nixpkgs-unstable (with the flake's overrides) provide. Raise them as new releases land.
dependencies = [
    "kicad-python>=0.8.0",
    "mcp>=2.3.0",
    "shapely>=2.1.2",
    "numpy>=2.5.3",
]

[project.scripts]
viaduct = "viaduct.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
